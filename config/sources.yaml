# Source registry for the Texas vs California analysis.
# Endpoints, dataset codes, and query params. Per CLAUDE.md, verify codes against
# live docs/metadata before trusting them — collectors resolve line codes at
# runtime where noted, rather than hardcoding guessed numbers.

geographies:
  states:
    california: { geo_id: "06000", fips: "06", name: California }
    texas:      { geo_id: "48000", fips: "48", name: Texas }
  # Metro GeoFips (BEA MSA codes) get added when metro-level collectors are built:
  #   Austin, Dallas-Fort Worth, Houston, San Antonio vs
  #   San Francisco, San Jose, Los Angeles, San Diego.

time:
  start_year: 2015
  end_year: latest   # resolved at runtime; never hardcode an end year

sources:

  # ------------------------------------------------------------------ BEA (built)
  bea:
    name: BEA Regional
    base_url: https://apps.bea.gov/api/data
    docs_url: https://apps.bea.gov/api/_pdf/bea_web_service_api_user_guide.pdf
    signup_url: https://apps.bea.gov/API/signup/
    api_key_env: BEA_API_KEY
    dataset: Regional
    result_format: JSON
    status: built
    tables:
      sagdp1:
        table_name: SAGDP1
        description: >
          State annual GDP summary: real GDP (chained dollars), current-dollar
          (nominal) GDP, and the chain-type quantity index for real GDP.
        geo_fips: ["06000", "48000"]   # California, Texas
        year: ALL                       # filtered to >= time.start_year in code
        # Line codes are resolved at runtime via GetParameterValuesFiltered by
        # matching the official LineCode descriptions. Do NOT hardcode guessed
        # numbers — BEA renumbers across vintages.
        line_code_match:
          real:
            include: ["real gross domestic product", "real gdp"]
            exclude: ["quantity", "index", "chain"]
          nominal:
            include: ["current-dollar gross domestic product", "current-dollar gdp", "current dollar gdp"]
            exclude: ["quantity", "index", "chain"]
    # Fallback if SAGDP1 ever stops exposing both measures cleanly:
    fallback_tables:
      real_by_industry:    { table_name: SAGDP9N, all_industry_line_match: "all industry total" }
      nominal_by_industry: { table_name: SAGDP2N, all_industry_line_match: "all industry total" }

  # ------------------------------------------------------- registry stubs (todo)
  bls:
    name: BLS
    base_url: https://api.bls.gov/publicAPI/v2/
    signup_url: https://data.bls.gov/registrationEngine/
    api_key_env: BLS_API_KEY
    gives: "QCEW employment & wages, CES/SAE jobs, LAUS unemployment, OEWS wages"
    status: stub

  census:
    name: Census
    base_url: https://api.census.gov/data
    signup_url: https://api.census.gov/data/key_signup.html
    api_key_env: CENSUS_API_KEY   # used by future ACS/BFS/CBP collectors (API-only)
    gives: "PEP population & components of change, ACS migration, BFS, CBP, govt finance"
    status: partial   # pep built (flat files); acs/bfs/cbp still stubs
    pep:
      # The Census Data API is frozen at Vintage 2021 for PEP and exposes NO
      # components/migration past 2019 (verified: 2022-2024 endpoints 404). So we
      # use the official PEP flat-file CSVs, which carry the full series incl. net
      # migration through the latest vintage. No API key required for these files.
      docs_url: https://www.census.gov/programs-surveys/popest.html
      access: csv_download
      geo_fips: ["06", "48"]   # California, Texas (2-digit state FIPS)
      sumlev_state: "040"
      # Year semantics: POPESTIMATE<Y> = population July 1, Y (STOCK).
      # NETMIG<Y>/BIRTHS<Y>/... = flow over the year ending July 1, Y (FLOW).
      vintages:
        - label: "Census PEP Vintage 2019"
          url: https://www2.census.gov/programs-surveys/popest/datasets/2010-2019/national/totals/nst-est2019-alldata.csv
          year_min: 2015
          year_max: 2019
        - label: "Census PEP Vintage 2024"
          url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2024/state/totals/NST-EST2024-ALLDATA.csv
          year_min: 2020
          year_max: 2024   # latest released; collector also auto-detects file max
      # Column stems (a trailing 4-digit year is appended). natural change differs
      # by vintage, so two candidate stems are listed.
      metric_stems:
        population:              { stems: ["POPESTIMATE"],     unit: persons,       measure: stock }
        net_migration:           { stems: ["NETMIG"],          unit: persons/year,  measure: flow }
        domestic_migration:      { stems: ["DOMESTICMIG"],     unit: persons/year,  measure: flow }
        international_migration:  { stems: ["INTERNATIONALMIG"], unit: persons/year, measure: flow }
        births:                  { stems: ["BIRTHS"],          unit: persons/year,  measure: flow }
        deaths:                  { stems: ["DEATHS"],          unit: persons/year,  measure: flow }
        natural_change:          { stems: ["NATURALINC", "NATURALCHG"], unit: persons/year, measure: flow }

  irs_soi:
    name: IRS SOI Migration
    base_url: https://www.irs.gov/pub/irs-soi
    docs_url: https://www.irs.gov/statistics/soi-tax-stats-migration-data
    access: csv_download   # direct state CSVs exist for every year; no zip needed
    api_key_env: null
    gives: "State migration flows incl. adjusted gross income (follow the money)"
    status: built
    user_agent: "TX-vs-CA economic research (contact michaelfox0418@gmail.com)"
    geo_fips: ["06", "48"]   # anchor states: California, Texas
    file_templates:
      inflow:  "stateinflow{pair}.csv"
      outflow: "stateoutflow{pair}.csv"
    # Year pairs (yy1yy2). Output `year` = ending year (20yy2); 1516 covers 2015-2016.
    # Append new pairs here as the IRS releases them.
    year_pairs: ["1516", "1617", "1718", "1819", "1920", "2021", "2122", "2223"]
    notes: >
      AGI is in THOUSANDS of current (nominal) USD; n1 = returns (proxy for
      households), n2 = individuals (proxy for persons). Aggregate origin/dest
      codes: 96 = Total Migration-US and Foreign; 97 = Total Migration-US
      (interstate) AND Total Migration-Same State -- these SHARE code 97, so the
      collector disambiguates by name (the interstate row's name ends with
      "Total Migration-US"); 98 = Total Migration-Foreign. Suppressed cells appear
      as negative sentinels and are dropped, not imputed.

  eia:
    name: EIA
    base_url: https://api.eia.gov/v2/
    signup_url: https://www.eia.gov/opendata/register.php
    api_key_env: EIA_API_KEY
    gives: "Electricity prices and generation mix by state"
    status: stub

  edgar:
    name: SEC EDGAR
    base_url: https://data.sec.gov
    submissions_url: https://data.sec.gov/submissions/CIK{cik10}.json
    docs_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    user_agent_env: SEC_USER_AGENT          # SEC requires a descriptive UA; no API key
    default_user_agent: "TX-vs-CA economic research michaelfox0418@gmail.com"
    api_key_env: null
    gives: "Company principal-office state (submissions API) + Form D offerings by state"
    status: built
    hq_relocations:
      # Curated list of notable, widely-reported corporate HQ relocations. The
      # collector VERIFIES each company's CURRENT principal-office state against
      # primary EDGAR submissions data. `move_announced_year` and `from_state`
      # are curated metadata (cite in narrative_research), NOT EDGAR-derived.
      # This is an illustrative, verified set -- not a complete census of moves.
      companies:
        - { cik: 1318605, name: "Tesla",                      from_state: CA, to_state: TX, move_announced_year: 2021 }
        - { cik: 1341439, name: "Oracle",                     from_state: CA, to_state: TX, move_announced_year: 2020 }
        - { cik: 1645590, name: "Hewlett Packard Enterprise", from_state: CA, to_state: TX, move_announced_year: 2020 }
        - { cik: 93410,   name: "Chevron",                    from_state: CA, to_state: TX, move_announced_year: 2024 }
        - { cik: 316709,  name: "Charles Schwab",             from_state: CA, to_state: TX, move_announced_year: 2021 }
        - { cik: 1138118, name: "CBRE Group",                 from_state: CA, to_state: TX, move_announced_year: 2020 }
        - { cik: 927653,  name: "McKesson",                   from_state: CA, to_state: TX, move_announced_year: 2019 }
        - { cik: 868857,  name: "AECOM",                      from_state: CA, to_state: TX, move_announced_year: 2021 }
        - { cik: 1321655, name: "Palantir Technologies",      from_state: CA, to_state: CO, move_announced_year: 2020 }  # CA departure NOT to TX (counter-nuance)
    form_d:
      dataset_url: https://www.sec.gov/files/structureddata/data/form-d-data-sets/{yyyy}q{q}_d.zip
      issuer_states: ["CA", "TX"]
      start_year: 2015
      submission_types: ["D"]   # new notices only (exclude D/A amendments) to avoid double-counting
      note: >
        TOTALAMOUNTSOLD is nominal USD and noisy (often 0 or indefinite at first
        filing), so OFFERING COUNT is the primary proxy and the $ figure is
        secondary/caveated. Form D covers ALL Reg D exempt offerings (VC, PE, real
        estate, hedge funds) -- a broad private-capital proxy, NOT VC alone.

  patentsview:
    name: USPTO PatentsView
    base_url: https://search.patentsview.org/api/v1/
    signup_url: https://patentsview.org/apis/keyrequest
    api_key_env: PATENTSVIEW_API_KEY
    gives: "Patents by state (innovation proxy)"
    status: stub

  fhfa_hpi:
    name: FHFA HPI
    access: csv_download
    api_key_env: null
    gives: "House Price Index by state/metro"
    status: stub

  zillow:
    name: Zillow Research
    access: csv_download
    api_key_env: null
    attribution_required: true   # if repo is public, keep Zillow attribution + mind terms
    gives: "Home values (ZHVI), rents (ZORI)"
    status: stub
